<svg xmlns="http://www.w3.org/2000/svg" width="640" height="110" viewBox="0 0 640 110" role="img" aria-labelledby="t"><title id="t">Evaluation protocol: preregister, freeze the protocol, run baselines first, then report nulls and withdrawals.</title><style></style><rect x=".5" y=".5" width="639" height="109" rx="10" fill="#F5F8FB" stroke="#D5DEE8"/><rect x="26" y="38" width="128" height="40" rx="6" fill="#FFFFFF" stroke="#0A7EA4" stroke-width="1.6"/><text x="90" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0" fill="#0B0F14" text-anchor="middle">PREREGISTER</text><path d="M158 58h16" stroke="#7C8A9A" stroke-width="1.6"/><rect x="178" y="38" width="128" height="40" rx="6" fill="#FFFFFF" stroke="#0A7EA4" stroke-width="1.6"/><text x="242" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0" fill="#0B0F14" text-anchor="middle">FREEZE PROTOCOL</text><path d="M310 58h16" stroke="#7C8A9A" stroke-width="1.6"/><rect x="330" y="38" width="128" height="40" rx="6" fill="#FFFFFF" stroke="#0A7EA4" stroke-width="1.6"/><text x="394" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0" fill="#0B0F14" text-anchor="middle">BASELINES FIRST</text><path d="M462 58h16" stroke="#7C8A9A" stroke-width="1.6"/><rect x="482" y="38" width="128" height="40" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.6"/><text x="546" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0" fill="#0B0F14" text-anchor="middle">REPORT NULLS</text><text x="26" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="1" fill="#7C8A9A" text-anchor="start">EVALUATION PROTOCOL</text></svg>